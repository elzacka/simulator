scenarier:
  - id: snmp_ups
    navn: "UPS slått av via SNMP"
    ikon: lucide/battery-charging
    kategori: "Strømforsyning og reservekraft"
    virksomhet: "Datasenter og kontorbygg"
    virksomhetIkon: lucide/server
    funksjon: "Strømforsyning (UPS)"
    funksjonIkon: lucide/battery-charging
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "Shodan finner UPS-ens nettverkskort på SNMP (UDP 161) med et søk som **port:161**. Kortet er eldre og har SNMP slått på fra fabrikken, med community-strengen «private» for skrivetilgang. Ingen har endret den. Nyere kort leveres med SNMP slått av."
      - "Et fritt kommandolinjeverktøy som snmpset (Net-SNMP) sender avslåingskommandoen. Ingen pålogging utover community-strengen, ingen kryptering i SNMPv2c."
    kort: "Standard community-streng «private» → angriperen slår av UPS-en → alt utstyr bak den mister strømmen"
    beskrivelse: "En UPS er byggets siste strømlinje for kritisk utstyr. En angriper kan slå den av med én SNMP-kommando hvis nettverkskortet er eksponert mot internett og fortsatt har standard community-streng. Alt som henger på UPS-en, mister strømmen umiddelbart, uten kontrollert nedstenging. Hvis bygget er et kritisk ledd i en verdikjede, stanser også leveransene som avhenger av det."
    lovkrav:
      - "Digitalsikkerhetsloven § 8"
      - "Digitalsikkerhetsforskriften §§ 10, 11 og 17"
    steg:
      - tid: 0
        sys: ups
        status: eksponert
        melding: "Rekognosering: UPS-ens nettverkskort svarer på SNMP (UDP 161) og er synlig i Shodan. Kortet er eldre, og community-strengen for skrivetilgang står fortsatt på fabrikkverdien «private». Enhetsnavnet og plasseringen i SNMP-svaret røper virksomheten."
      - tid: 900
        sys: ups
        status: kompromittert
        melding: "Angrep: Angriperen sender en SNMPv2c SetRequest med community-strengen «private» til utgangskontrollen i UPS-ens MIB (hos APC: upsAdvControlUpsOff). Angriperen velger umiddelbar avslåing, ikke kontrollert avslåing med forsinkelse."
      - tid: 1800
        sys: ups
        status: nede
        melding: "UPS-en kobler ut utgangen umiddelbart. Alt utstyr som henger på den, mister strømmen uten forvarsel."
      - tid: 2600
        sys: server
        status: nede
        melding: "Serverne mister strømmen uten kontrollert nedstenging. Åpne skriveoperasjoner avbrytes, med risiko for datakorrupsjon og filsystemfeil."
      - tid: 3400
        sys: brannmur
        status: nede
        melding: "Brannmuren mister strømmen. Segmentering og nettverksbeskyttelse faller bort."
      - tid: 4200
        sys: TVO
        status: nede
        melding: "Kamera og NVR mister strømmen. Alle kameraer er svarte, og opptaket stopper."
        lovkrav: "Digitalsikkerhetsforskriften § 11. Fysiske sikkerhetstiltak"
      - tid: 5000
        sys: aak
        status: svekket
        melding: "Adgangskontrollen går over på nødbatteri. Loggføringen stopper etter rundt 15 minutter."
      - tid: 5800
        sys: fagsystem
        status: nede
        melding: "Alle fagsystemer er utilgjengelige. Virksomhetens tjenester stanser, og leveranser som avhenger av bygget, rammes."
        lovkrav: "Digitalsikkerhetsforskriften § 10. Teknologiske sikkerhetstiltak"
    tiltak:
      forebygging:
        - "Slå av SNMPv1 og v2c, og bruk SNMPv3 med autentisering og kryptering (authPriv). Bytt community-strengene og gi bare lesetilgang hvis v1 eller v2c må stå på."
        - "Begrens SNMP-tilgang med IP-basert ACL. Tillat bare dedikerte administrasjonsstasjoner."
        - "Segmenter OT-nettet fra internett og kontornett. SNMP skal aldri være eksponert mot internett."
        - "Sjekk egen eksponering i Shodan: **net:<ditt nett> port:161**, der <ditt nett> er virksomhetens IP-område. Hvert treff er et SNMP-utstyr som svarer fra internett og skal tas ned. Overvåk området videre med Shodan Monitor."
      respons:
        - "Varsle tilsynsmyndigheten innen 24 timer, med kopi til NSM, etter digitalsikkerhetsloven § 8 og digitalsikkerhetsforskriften § 17 hvis virksomheten er omfattet."
        - "Gjennomgå alt nettverkstilkoblet OT-utstyr for fabrikkpassord. Anta at ingen er endret."
        - "Vurder dataintegriteten på servere som ble avsluttet ukontrollert. Sjekk filsystemet ved oppstart."

  - id: strombrudd_svikt
    navn: "Strømbrudd og svikt i nødstrøm"
    ikon: lucide/zap-off
    kategori: "Strømforsyning og reservekraft"
    virksomhet: "Datasenter og kontorbygg"
    virksomhetIkon: lucide/server
    funksjon: "Nødstrøm og UPS"
    funksjonIkon: lucide/zap
    trussel:
      art: Utilsiktet
      kilde: "Naturhendelse og teknisk svikt"
    kort: "Lynnedslag tar nettstrømmen → nødstrømsaggregatet starter ikke → gamle UPS-batterier er tomme etter få minutter"
    beskrivelse: "Samme strømavhengighet som ved et angrep kan ryke uten noen angriper. Et lynnedslag tar nettstrømmen, nødaggregatet starter ikke, og eldre UPS-batterier holder bare noen minutter. Hendelsen er ikke tilsiktet, men følger av naturhendelse, teknisk svikt og manglende vedlikehold. Konsekvensen er den samme som i UPS-angrepet, og viser at OT-beredskap må tåle mer enn menneskelige trusler."
    lovkrav:
      - "Digitalsikkerhetsforskriften § 11"
    steg:
      - tid: 0
        sys: nettstrom
        status: nede
        melding: "Naturhendelse: Et lynnedslag under høststormen slår ut nettstrømmen til bygget 02:40. Inntaket er dødt, og bygget skal gå over på nødstrøm."
      - tid: 1000
        sys: aggregat
        status: feil
        melding: "Teknisk svikt: Nødaggregatet skal starte automatisk, men startbatteriet er utladet, og aggregatet er ikke testkjørt under last på over et år. Det starter ikke."
      - tid: 2000
        sys: ups
        status: kritisk
        melding: "UPS-en bærer hele lasten alene. Batteribankene er eldre enn levetiden og aldri byttet, så reell driftstid er langt kortere enn merkeverdien."
      - tid: 3000
        sys: ups
        status: nede
        melding: "UPS-batteriene er utladet etter få minutter. Utgangen faller bort, og alt kritisk utstyr mister strømmen."
      - tid: 3800
        sys: server
        status: nede
        melding: "Serverne mister strømmen uten kontrollert nedstenging. Risiko for datakorrupsjon på åpne volumer."
      - tid: 4600
        sys: brannmur
        status: nede
        melding: "Brannmuren mister strømmen. Nettverksbeskyttelsen faller bort."
      - tid: 5400
        sys: fagsystem
        status: nede
        melding: "Fagsystemene er utilgjengelige. Driften stanser, og leveranser som avhenger av bygget, forsinkes. Årsaken var ikke et angrep, men manglende vedlikehold og testing av nødstrøm."
        lovkrav: "Digitalsikkerhetsforskriften § 11. Fysiske sikkerhetstiltak"
    tiltak:
      forebygging:
        - "Testkjør nødaggregatet under last jevnlig, og bytt startbatteriet etter leverandørens intervall."
        - "Overvåk UPS-batterienes alder og helse, og bytt batteribanker før levetiden er ute."
        - "Gjennomfør periodisk avbruddstest av hele strømkjeden, så nødstrøm er bekreftet å virke."
        - "Sørg for kontrollert nedstenging av servere når gjenstående UPS-tid nærmer seg slutt."
        - "Vurder redundant strømmating på to uavhengige kurser for kritisk utstyr."
      respons:
        - "Gjenopprett nettstrøm eller få aggregatet i drift, og lad UPS-ene før last kobles på igjen."
        - "Kontroller dataintegriteten på servere som ble avsluttet ukontrollert."
        - "Registrer hendelsen som avvik, og planlegg batteribytte og fast testrutine for aggregatet."

  - id: serverkjoling
    navn: "Serverromkjøling slått av via BACnet"
    ikon: tabler/air-conditioning
    kategori: "Byggautomasjon og SD-anlegg"
    virksomhet: "Datasenter og serverrom"
    virksomhetIkon: lucide/server
    funksjon: "Presisjonskjøling (CRAC)"
    funksjonIkon: tabler/air-conditioning
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "BMS/SD-anlegget svarer på BACnet-forespørsler (UDP 47808) og er synlig i Shodan med et søk som **port:47808**, med navn, leverandør, modell og plassering. BACnet/IP har ingen pålogging, så enheten svarer alle som spør."
      - "Et fritt verktøy som YABE (Yet Another BACnet Explorer) kobler til, leser objekttreet og skriver til «commandable» objekter med WriteProperty. Ingen pålogging, ingen kryptering."
      - "Den sikrede varianten BACnet/SC bruker TLS med sertifikater, men krever utstyr som støtter den."
    kort: "SD-anlegg eksponert mot internett → settpunktet for kjøling heves til 45 °C → serverrommet overopphetes"
    beskrivelse: "Serverrom holdes kjølige av presisjonskjøling (CRAC), styrt gjennom byggets BACnet-baserte SD-anlegg. En angriper kan heve kjølesettpunktet utenfra med et gratis BACnet-verktøy hvis anlegget er eksponert mot internett. Kjølingen stanser, serverrommet overopphetes, og serverne går i termisk nødavstenging. Da faller et kritisk ledd i den digitale infrastrukturen, med tjenester mange andre er avhengige av."
    deteksjon:
      vedSteg: 5
      kilde: "Oppdaget da serverne gikk i termisk nødavstenging og tjenester falt ut"
      forsinkelse: "Under 30 minutter"
      overvaket: false
    lovkrav:
      - "Digitalsikkerhetsloven § 8"
      - "Digitalsikkerhetsforskriften §§ 10 og 17"
    steg:
      - tid: 0
        sys: bms
        status: eksponert
        melding: "Rekognosering: BMS/SD-anlegget svarer på BACnet Who-Is (UDP 47808) og er synlig i Shodan. Ingen autentisering. Enhetsnavnet røper byggets adresse."
      - tid: 1500
        sys: bms
        status: kompromittert
        melding: "Kartlegging: Angriperen kobler YABE til IP-en fra Shodan. BACnet-objekttreet lastes automatisk. Objektet for kjølesettpunkt er merket «commandable», altså skrivbart uten restriksjoner."
      - tid: 3000
        sys: serverkjoler
        status: manipulert
        melding: "Angrep: YABE WriteProperty setter kjølesettpunktet til 45 °C med prioritet 1, høyeste nivå i priority array. Enheten bekrefter kommandoen. Kjølemaskinen tror rommet allerede er kaldere enn mål."
      - tid: 4500
        sys: serverkjoler
        status: nede
        melding: "Presisjonskjølingen (CRAC) stenger kjøleventilen og stopper viftene. Serverrommet mister aktiv kjøling, uten at BMS-alarmen går, fordi settpunktet er endret og ikke brutt."
      - tid: 6000
        sys: servertemp
        status: kritisk
        melding: "Temperaturen i serverrommet stiger raskt mot 35 °C. Varmelasten fra serverne har ingen steder å gå."
      - tid: 7500
        sys: server
        status: nede
        melding: "Serverne går i termisk nødavstenging for å unngå maskinvareskade. Tjenester som avhenger av serverrommet, faller ut. Et kritisk ledd i den digitale infrastrukturen er nede."
        lovkrav: "Digitalsikkerhetsforskriften § 10. Teknologiske sikkerhetstiltak"
      - tid: 9000
        sys: angriper
        status: advarsel
        melding: "Angriperen kobler fra. YABE lukkes, og tilgangen avsluttes. Hele forløpet fra Shodan-funn til utført angrep tok under 10 minutter, uten pålogging og uten spor i et påloggingssystem."
    tiltak:
      forebygging:
        - "Ta SD-anlegget av internett. BACnet (UDP 47808) skal aldri være eksponert. Fjernservice går via VPN med flerfaktorautentisering eller en sikret mellomløsning."
        - "Blokker UDP 47808 på sonegrensene, og begrens WriteProperty til BMS-operatørens arbeidsstasjon."
        - "Bruk BACnet/SC (TLS) der det støttes, og hold bacnet-stack og styringsprogramvare oppdatert mot kjente sårbarheter."
        - "Overvåk serverromtemperaturen uavhengig av BMS, med egen sensor og alarm til døgnbemannet drift."
        - "Segmenter SD-anlegget fra IT-nettet, så et kompromittert kontornett ikke kan nå kjølestyringen."
        - "Sjekk egen eksponering i Shodan: **net:<ditt nett> port:47808** finner BACnet-anlegg som svarer fra internett, der <ditt nett> er virksomhetens IP-område. Hvert treff er et SD-anlegg som skal av nett."
      respons:
        - "Sett kjølesettpunktet tilbake og verifiser hele priority array mot en kjent baseline."
        - "Steng fjerntilgangen straks, og koble SD-anlegget fra internett til arkitekturen er sikret."
        - "Kontroller serverne for termisk skade og dataintegritet etter nødavstengingen."
        - "Varsle tilsynsmyndigheten innen 24 timer, med kopi til NSM, etter digitalsikkerhetsloven § 8 og digitalsikkerhetsforskriften § 17 hvis virksomheten er omfattet."

  - id: adgangskontroll
    navn: "Dører låst opp via adgangskontrollen"
    ikon: lucide/door-open
    kategori: "Fysisk sikring og nettverk"
    virksomhet: "Lager og offentlig tjenestebygg"
    virksomhetIkon: lucide/warehouse
    funksjon: "Fysisk adgangskontroll"
    funksjonIkon: lucide/id-card-lanyard
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "Shodan finner adgangskontrollerens web-/administrasjonsgrensesnitt (HTTP/HTTPS) åpent mot internett med et søk som **port:80,443 has_screenshot:true**, ofte med fabrikkpassord."
      - "Døren låses opp fra nettleseren eller via enhetens eget API. Ingen BACnet her, bare et styringsgrensesnitt som aldri skulle vært eksponert."
    kort: "Adgangskontrollen nås fra internett med fabrikkpassord → dørene låses opp om natten → ingen alarm"
    beskrivelse: "Adgangskontrollen er bygningens usynlige funksjon for å holde uvedkommende ute. I et bygg som er et kritisk ledd i en leveransekjede, for eksempel et lager eller et offentlig tjenestebygg, blir dørene en fjernstyrt bryter hvis kontrolleren står på internett. En angriper låser opp om natten, og adgangsloggen endres så alt ser normalt ut. Konsekvensen er fysisk innbrudd, tukling med utstyr og tap av sporbarhet."
    deteksjon:
      vedSteg: 5
      kilde: "Oppdaget morgenen etter, ved avvik i varelageret og fysisk kontroll"
      forsinkelse: "Hele natten"
      overvaket: false
    lovkrav:
      - "Digitalsikkerhetsloven § 8"
      - "Digitalsikkerhetsforskriften §§ 11 og 17"
      - "Personvernforordningen (GDPR) art. 32"
    steg:
      - tid: 0
        sys: aak
        status: eksponert
        melding: "Rekognosering: Adgangskontrolleren har et administrasjonsgrensesnitt åpent mot internett for fjernservice. Enheten er synlig i offentlige søketjenester, uten pålogging eller med fabrikkpassord."
      - tid: 1500
        sys: aak
        status: manipulert
        melding: "Angrep: Angriperen logger inn med fabrikkpassord, endrer dørplanen og sender en opplåsingskommando via enhetens eget API. Kontrolleren utfører den som en vanlig driftskommando, og loggen endres samtidig."
      - tid: 3000
        sys: dorlas
        status: manipulert
        melding: "Ytterdører og sluser låses opp midt på natten. For bygget ser alt normalt ut: Ingen tvang, ingen brutt lås, bare en kommando innenfra systemet."
      - tid: 4500
        sys: TVO
        status: svekket
        melding: "Kameraopptaket står, men ingen følger med om natten. Opplåsingen gir ingen alarm, fordi systemet regner en kommando innenfra som normal drift."
      - tid: 6000
        sys: vaktrom
        status: advarsel
        melding: "Ingen reagerer. Adgangsloggen viser ikke hvem som gikk inn, fordi angriperen har endret den."
      - tid: 7500
        sys: server
        status: kompromittert
        melding: "Uvedkommende får fysisk tilgang til serverrom og lager. Utstyr kan manipuleres, kopieres eller fjernes, og et kritisk ledd i leveransekjeden settes ut av spill."
        lovkrav: "Digitalsikkerhetsforskriften § 11. Fysiske sikkerhetstiltak"
    tiltak:
      forebygging:
        - "Ta adgangskontroll og dørstyring av internett. Fjernservice skal gå via VPN med flerfaktorautentisering eller en sikret mellomløsning."
        - "Bytt fabrikkpassord og krev sterk pålogging. Slå av grensesnitt og tjenester som ikke er i bruk."
        - "Loggfør adgang uavhengig av kontrolleren, så en opplåsing ikke kan skjules ved å endre loggen lokalt."
        - "Sett opp alarm på opplåsing utenfor åpningstid, og koble den til vakt som faktisk følger med."
        - "Segmenter adgangskontroll fra kontor- og internett, og skjerm serverrom som egen sone."
        - "Sjekk egen eksponering i Shodan: **net:<ditt nett> port:80,443 has_screenshot:true** viser internettvendte styringer med innloggingsbilde, der <ditt nett> er virksomhetens IP-område. Hvert treff med en adgangskontroll er en styring som skal av nett."
      respons:
        - "Lås dørene manuelt, tilbakestill dørplanen og verifiser alle skrivbare verdier mot en kjent baseline."
        - "Steng fjerntilgangen straks, og koble kontrolleren fra internett til arkitekturen er sikret."
        - "Gjennomgå kamera og fysiske spor for perioden, og undersøk om noen var inne."
        - "Meld hendelsen til politiet. Varsle tilsynsmyndigheten innen 24 timer, med kopi til NSM, etter digitalsikkerhetsloven § 8 og digitalsikkerhetsforskriften § 17 hvis virksomheten er omfattet."

  - id: varme_legionella
    navn: "Senket varmtvannstemperatur gir legionellarisiko"
    ikon: material/water_heater
    kategori: "Byggautomasjon og SD-anlegg"
    virksomhet: "Sykehjem og svømmehall"
    virksomhetIkon: tabler/old
    funksjon: "Varmt tappevann"
    funksjonIkon: material/water_heater
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "Varmestyringen er som regel koblet til byggets SD-anlegg. Shodan finner den på BACnet (UDP 47808) eller Modbus TCP (502) med et søk som **port:47808,502**."
      - "Et fritt verktøy kan skrive settpunktet hvis enheten mangler pålogging. For BACnet er YABE (Yet Another BACnet Explorer) et vanlig eksempel."
    kort: "SD-anlegg eksponert mot internett → settpunktet for varmtvann senkes fra 70 til 38 °C → legionella kan vokse i rørnettet"
    beskrivelse: "Varmtvannet må holde høy temperatur for å hindre legionella. Helsedirektoratet anbefaler at berederen jevnlig varmes opp til minst 70 °C, og at vannet når minst 60 °C ved tappestedet. I bygg med sårbare brukere, for eksempel sykehjem og svømmehaller, har varmestyringen ofte fjerntilgang for service. En angriper som senker settpunktet, gjør vannet lunkent. Legionella formerer seg i rør og dusjer, og faren er usynlig til noen blir syke. Dette er «når hackerne skrur opp varmen» speilvendt: Her skrus den ned."
    deteksjon:
      vedSteg: 5
      kilde: "Oppdaget da brukere ble syke og prøvene påviste legionella"
      forsinkelse: "Flere dager"
      overvaket: false
    lovkrav:
      - "Forskrift om miljørettet helsevern kap. 3a"
      - "Digitalsikkerhetsloven § 8"
    steg:
      - tid: 0
        sys: vvskontroller
        status: eksponert
        melding: "Rekognosering: VVS-/varmestyringen står åpen på internett for fjernservice, uten pålogging. Enheten er synlig i offentlige søketjenester."
      - tid: 1500
        sys: vvskontroller
        status: manipulert
        melding: "Angrep: Angriperen senker settpunktet for varmtvann fra 70 °C til 38 °C, med WriteProperty over BACnet eller ved å skrive registeret over Modbus. Kontrolleren regulerer ned."
      - tid: 3000
        sys: varmtvann
        status: manipulert
        melding: "Berederen holder nå lunkent vann. Det kjennes behagelig i springen, men temperaturen er under grensen som holder legionella nede."
      - tid: 4500
        sys: vvstemp
        status: advarsel
        melding: "Temp-sensoren viser 38 °C. Driftsbildet melder «normalt», fordi settpunktet er endret og ikke brutt. Ingen alarm."
      - tid: 6500
        sys: tappepunkt
        status: kritisk
        melding: "Over flere dager formerer legionella seg i rør, dusjer og sjeldent brukte tappepunkter. Risikoen er usynlig til noen puster inn aerosoler fra en dusj."
        lovkrav: "Forskrift om miljørettet helsevern kap. 3a. Krav om å hindre spredning av Legionella via aerosol"
      - tid: 8500
        sys: tappepunkt
        status: nede
        melding: "Smitte kan ikke utelukkes. Bygget må stenge berørte dusjer, varsle kommunelegen og desinfisere anlegget termisk. En kritisk tjeneste for sårbare brukere settes ut av spill."
        lovkrav: "Forskrift om miljørettet helsevern kap. 3a. Krav om å hindre spredning av Legionella via aerosol"
    tiltak:
      forebygging:
        - "Ta VVS- og varmestyring av internett. Fjernservice skal gå via VPN med flerfaktorautentisering eller en sikret mellomløsning."
        - "Lås settpunktet for varmtvann innenfor trygge grenser, og krev pålogging for å endre det."
        - "Overvåk varmtvannstemperaturen uavhengig av styringen, med egen sensor og alarm ved for lav temperatur."
        - "Følg rutinene for legionellakontroll i forskrift om miljørettet helsevern, og øv på termisk desinfeksjon."
        - "Segmenter VVS fra kontor- og internett."
        - "Sjekk egen eksponering i Shodan: **net:<ditt nett> port:47808,502** finner VVS-styring på BACnet eller Modbus som svarer fra internett, der <ditt nett> er virksomhetens IP-område. Hvert treff skal tas ned."
      respons:
        - "Sett varmtvannstemperaturen tilbake til trygg verdi og verifiser mot baseline."
        - "Gjennomfør termisk eller kjemisk desinfeksjon, og steng berørte tappepunkter til prøvene er klare."
        - "Varsle kommunelegen og ta legionellaprøver."
        - "Steng fjerntilgangen og meld hendelsen til politiet. Varsle tilsynsmyndigheten innen 24 timer, med kopi til NSM, hvis virksomheten er omfattet av digitalsikkerhetsloven."

  - id: ventilasjon
    navn: "Ventilasjonsaggregat stoppet utenfra"
    ikon: lucide/fan
    kategori: "Byggautomasjon og SD-anlegg"
    virksomhet: "Kontorbygg og laboratorium"
    virksomhetIkon: lucide/building-2
    funksjon: "Ventilasjon og inneklima"
    funksjonIkon: lucide/fan
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "Ventilasjonsaggregatet styres fra byggets SD-anlegg. Shodan finner det på BACnet (UDP 47808) eller Modbus TCP (502) med et søk som **port:47808,502**."
      - "Et fritt verktøy som YABE (BACnet) skriver rett til drift og settpunkt hvis enheten mangler pålogging."
    kort: "SD-anlegg eksponert mot internett → aggregatet stoppes → CO2 passerer 1000 ppm, og de ansatte forlater bygget"
    beskrivelse: "Ventilasjon går i bakgrunnen og holder lufta pustbar. I noen bygg holder den også trykk, for eksempel i laboratorier eller renrom. Aggregatet har ofte fjerntilgang for service. En angriper som stopper det, får CO2 og fukt til å stige. Folk får hodepine og går hjem, og virksomheten som er avhengig av bygget, stopper opp. I trykk-kontrollerte rom er konsekvensen verre, fordi forurensning kan trekke inn."
    deteksjon:
      vedSteg: 4
      kilde: "Oppdaget da ansatte reagerte på tung luft og hodepine"
      forsinkelse: "Noen timer"
      overvaket: false
    lovkrav:
      - "Arbeidsplassforskriften § 2-14"
      - "Digitalsikkerhetsloven § 8"
    steg:
      - tid: 0
        sys: ventkontroller
        status: eksponert
        melding: "Rekognosering: Ventilasjonsstyringen står åpen på internett for fjernservice, uten pålogging. Enheten er synlig i offentlige søketjenester."
      - tid: 1500
        sys: ventkontroller
        status: manipulert
        melding: "Angrep: Angriperen setter driften til «av» og nuller viftepådraget med WriteProperty over BACnet. Kontrolleren utfører kommandoen som en vanlig driftsendring."
      - tid: 3000
        sys: vifte
        status: nede
        melding: "Viftene stopper. Luftutskiftingen opphører i hele bygget."
      - tid: 4500
        sys: co2sensor
        status: advarsel
        melding: "CO2 stiger jevnt forbi 1000 ppm. Driftsbildet melder «normalt», fordi pådraget er satt til null med vilje og ikke har feilet. Ingen alarm."
      - tid: 6500
        sys: inneklima
        status: kritisk
        melding: "Lufta blir tung. Ansatte får hodepine og konsentrasjonssvikt, og mange forlater bygget. Driften stopper opp, og leveranser som avhenger av bygget, forsinkes."
        lovkrav: "Arbeidsplassforskriften § 2-14. Klima, ventilasjon, luftkvalitet mv."
      - tid: 8500
        sys: inneklima
        status: kritisk
        melding: "I trykk-kontrollerte rom, som laboratorier eller renrom, faller overtrykket. Forurensning kan trekke inn, og prøver eller produksjon må kasseres og valideres på nytt."
    tiltak:
      forebygging:
        - "Ta ventilasjonsstyring av internett. Fjernservice skal gå via VPN med flerfaktorautentisering eller en sikret mellomløsning."
        - "Krev pålogging og lås kritiske settpunkter for vifte, trykk og CO2-grenser."
        - "Overvåk CO2 og trykk uavhengig av styringen, med egen alarm."
        - "Sett opp alarm ved stans i luftbehandlingen, særlig for rom med trykk-krav."
        - "Segmenter ventilasjon fra kontor- og internett."
        - "Sjekk egen eksponering i Shodan: **net:<ditt nett> port:47808,502** finner ventilasjonsstyring på BACnet eller Modbus som svarer fra internett, der <ditt nett> er virksomhetens IP-område. Hvert treff skal tas ned."
      respons:
        - "Start ventilasjonen manuelt og verifiser settpunktene mot baseline."
        - "Luft ut eller tøm rom med høy CO2, og vurder helsen til dem som var til stede."
        - "For trykk-kontrollerte rom: Vurder forurensning og behov for ny validering."
        - "Steng fjerntilgangen og meld hendelsen til politiet. Varsle tilsynsmyndigheten innen 24 timer, med kopi til NSM, hvis virksomheten er omfattet av digitalsikkerhetsloven."

  - id: patching
    navn: "Automatisk brannmuroppdatering slår ut kameraene"
    ikon: lucide/cctv-off
    kategori: "Fysisk sikring og nettverk"
    virksomhet: "Virksomhet med videoovervåkning"
    virksomhetIkon: lucide/building-2
    funksjon: "Nettverk og kamera"
    funksjonIkon: lucide/cctv
    trussel:
      art: Utilsiktet
      kilde: Feilkonfigurasjon
    kort: "Ny fastvare på brannmuren → feil tilgangsregel (ACL) blokkerer kameranettet → ingen opptak og ingen alarm"
    beskrivelse: "Ikke alle OT-hendelser er angrep. En automatisk firmware-oppdatering på brannmuren legger inn en feil ACL-regel som blokkerer kamerasegmentet. Ingen angriper er involvert, men konsekvensen er reell: Kameraene blir svarte, adgangsloggen stanser, og feilen ligner ikke et kjent angrep, så den må spores fra bunnen. Scenarioet viser den utilsiktede, menneskeskapte trusselen: Endringer uten testing og kontroll."
    deteksjon:
      vedSteg: 4
      kilde: "Vakt oppdaget svarte skjermer under runde og varslet IT-vakt"
      forsinkelse: "8 minutter"
      overvaket: false
    lovkrav:
      - "Digitalsikkerhetsforskriften § 10"
      - "Personvernforordningen (GDPR) art. 32"
    steg:
      - tid: 0
        sys: brannmur
        status: oppdateres
        melding: "Automatisk firmware-oppdatering starter 03:14. Brannmuren laster ny programvare og restarter. Ingen endringskontroll eller testmiljø i forkant."
      - tid: 1400
        sys: brannmur
        status: feil
        melding: "Oppdateringen fullføres, men det nye regelsettet tolker en ACL feil og blokkerer VLAN 30 (kamera- og NVR-segmentet) utilsiktet. Ingen varsling, fordi tap av kamera ikke er definert som en sikkerhetshendelse."
      - tid: 1700
        sys: TVO
        status: nede
        melding: "NVR-en mister kontakt med alle kameraer via VLAN 30. Svarte skjermer i hele bygget."
        lovkrav: "Digitalsikkerhetsforskriften § 10. Teknologiske sikkerhetstiltak"
      - tid: 2000
        sys: aak
        status: svekket
        melding: "Adgangskontroll-serveren er utilgjengelig via VLAN 30. Loggføringen stanser."
      - tid: 2800
        sys: vaktrom
        status: advarsel
        melding: "Vakt oppdager svarte skjermer 03:22 og varsler IT-vakt. Feilen ligner ikke et kjent angrep, så årsaken må spores opp fra bunnen."
      - tid: 3800
        sys: brannmur
        status: normal
        melding: "IT-vakt sporer feilen til den nye ACL-regelen og ruller tilbake oppdateringen 04:28. Diagnose og retting tok rundt en time. Total nedetid: 1 time 14 minutter."
      - tid: 4400
        sys: TVO
        status: normal
        melding: "Kameraene er online igjen. Opptaket gjenopptas, med et hull i videohistorikken på 1 time 14 minutter."
      - tid: 4400
        sys: aak
        status: normal
        melding: "Adgangslogging er gjenopptatt etter 1 time 14 minutter uten sporing."
    tiltak:
      forebygging:
        - "Deaktiver automatiske firmware-oppdateringer på brannmur og sikkerhetskritisk nettverksutstyr. Krev manuell godkjenning."
        - "Test alle oppdateringer i et labmiljø (non-prod) som speiler produksjonskonfigurasjonen."
        - "Sett opp alarm ved nettverkstap til kamerasegmentet (VLAN 30). Tap av kamerakommunikasjon er en sikkerhetsrelevant hendelse."
        - "Innfør endringshåndtering med rollback-plan for alle brannmuroppdateringer."
      respons:
        - "Gjennomgå hullet i videohistorikken (1 time 14 minutter) for å verifisere at ingen sikkerhetshendelser var uoppdaget i nedetiden."
        - "Dokumentér hendelsen og oppdater endringsrutinen med krav om ACL-validering etter oppdatering."
        - "Vurder om adgangskortlogger for nedetiden kan rekonstrueres fra alternative kilder."

  - id: kjoleanlegg
    navn: "Kjøleanlegg i dagligvarebutikk manipulert utenfra"
    ikon: lucide/refrigerator
    kategori: "Kjøl og frys"
    virksomhet: Dagligvarebutikk
    virksomhetIkon: lucide/store
    funksjon: "Kjøl og frys (matforsyning)"
    funksjonIkon: lucide/snowflake
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "Shodan finner kjøle- og fryskontrolleren på webgrensesnittet (HTTP/HTTPS), for Danfoss med et søk som **http.title:StoreView**. Enhetsnavnet røper ofte butikken."
      - "Utgåtte modeller som Danfoss AK-SM 800 og AK-SC 355 får ikke sikkerhetsoppdateringer. På AK-SM 800A med eldre fastvare kan angriperen omgå påloggingen (CVE-2025-41450)."
    kort: "Kjølestyringen eksponert mot internett → angriperen tvinger på avriming → temperaturen stiger mot 50 °C, og varene må kastes"
    beskrivelse: "I oktober 2026 ble kjøle- og fryseanlegg i flere hundre franske dagligvarebutikker manipulert utenfra, og i november spredte angrepene seg til flere land. Kontrolleren styrer temperatur og avriming og står ofte åpen på internett for fjernservice. En angriper endrer innstillingene, slik at anlegget varmer i stedet for å kjøle. I de franske butikkene steg temperaturen mot 50 °C i løpet av natten, nok til at varer måtte kastes og overopphetet utstyr kunne ta fyr. OT som dette faller mellom IT-sikkerhet og teknisk drift, og bevisstheten om risikoen er lav."
    deteksjon:
      vedSteg: 7
      kilde: "Ansatt oppdaget tint vann på gulvet og ødelagte varer da butikken åpnet om morgenen"
      forsinkelse: "Hele natten"
      overvaket: false
    lovkrav:
      - "Næringsmiddelhygieneforskriften § 12"
      - "Matloven § 16"
    steg:
      - tid: 0
        sys: kjolekontroller
        status: eksponert
        melding: "Rekognosering: Kjøle- og fryskontrolleren, av samme type som Danfoss-utstyret rammet i Frankrike, står åpen på internett for fjernservice. Shodan viser webgrensesnittet. Navnet røper butikken."
      - tid: 1500
        sys: kjolekontroller
        status: manipulert
        melding: "Angrep: Angriperen omgår påloggingen i webgrensesnittet og endrer temperatur- og avrimingsstyringen. Anlegget settes i kontinuerlig avriming med varene inne, slik som i de franske angrepene. Kontrolleren godtar endringen som en vanlig driftskommando."
      - tid: 3000
        sys: fryserom
        status: nede
        melding: "Avrimingsvarmen står på i kjøle- og fryserommet. I stedet for å kjøle varmer anlegget aktivt, og temperaturen stiger raskt."
      - tid: 4500
        sys: kjoletemp
        status: advarsel
        melding: "Temperaturen i kjøl og frys stiger raskt. Driftsbildet viser fortsatt «normal drift», fordi endringen er en gyldig driftskommando og ikke en feil."
      - tid: 6500
        sys: kjolealarm
        status: svekket
        melding: "Temperaturalarmen henger på den samme manipulerte kontrolleren og varsler derfor ikke. Angrepet skjer om natten, uten personale til stede."
      - tid: 8500
        sys: kjoledisk
        status: kritisk
        melding: "Kjøle- og frysediskene passerer trygg temperatur og er på vei mot 50 °C, som i de franske butikkene. Kjølekjeden er brutt."
        lovkrav: "Næringsmiddelhygieneforskriften § 12. Særskilte bestemmelser om lett bedervelige næringsmidler"
      - tid: 10500
        sys: matvarer
        status: kritisk
        melding: "Matvarene har vært over trygg temperatur for lenge og er ikke lenger trygge å selge."
        lovkrav: "Matloven § 16. Næringsmiddeltrygghet"
      - tid: 12500
        sys: matvarer
        status: odelagt
        melding: "Matvarene er ødelagt og må kastes. Butikken tømmer diskene om morgenen. Tapet er økonomisk, og driften forstyrres. Overopphetet utstyr kan i verste fall gi brann- eller vannskade."
    tiltak:
      forebygging:
        - "Ta kjøle- og fryskontrollere av internett. Fjernservice skal gå gjennom VPN med flerfaktorautentisering eller en sikret mellomløsning, ikke en åpen port."
        - "Krev pålogging på alt OT-utstyr. Bytt fabrikkpassord, og slå av tjenester anlegget ikke bruker."
        - "Sett opp en temperaturalarm som er uavhengig av styringssystemet, med egen sensor og et varsel som når vakt eller personale hele døgnet."
        - "Skill kjøl og frys fra kontor- og kassenettet. Et kompromittert kontornett skal ikke kunne nå kjølestyringen."
        - "Oppdater fastvaren. Bytt ut utgåtte modeller (får ikke sikkerhetsoppdateringer)."
        - "Søk jevnlig etter eget utstyr i Shodan, og ta ned det som er eksponert. For Danfoss-styringer: **net:<ditt nett> http.title:StoreView**. Mer generelt viser **net:<ditt nett> port:80,443 has_screenshot:true** internettvendte styringer med innloggingsbilde. Ta stedsnavn ut av enhetsnavnene."
        - "Still sikkerhetskrav ved innkjøp. For trådløst utstyr krever radioutstyrforskriften § 6 fra 01.08.25 at utstyret ikke skader nettet, beskytter personopplysninger og personvern og hindrer svindel (RED art. 3.3 bokstav d, e og f). For nettilkoblet utstyr gjelder det bare når utstyret behandler person-, trafikk- eller lokasjonsdata. Nkom fører tilsyn."
        - "EUs Cyber Resilience Act (CRA) stiller tilsvarende krav til alle produkter med digitale elementer, også kablet utstyr som kjølekontrollere, og krever blant annet at utstyret leveres uten fabrikkpassord og med støtte for sikkerhetsoppdateringer. Den får full virkning i EU 11.12.27, men er ennå ikke tatt inn i EØS-avtalen. (Status per 09.11.26.)"
      respons:
        - "Sett kjøle- og frysesettpunktene tilbake til riktig verdi manuelt, og kontroller alle skrivbare verdier, også avrimingsplanen, mot en kjent baseline."
        - "Steng fjerntilgangen straks, og koble kontrolleren fra internett inntil arkitekturen er sikret."
        - "Kartlegg matvarer som har vært over trygg temperatur, og kassér dem. Dokumentér for mattrygghet og forsikring."
        - "Meld hendelsen til politiet og til NSM. Varehandelen faller stort sett utenfor digitalsikkerhetsloven, men en melding styrker det nasjonale situasjonsbildet."

  - id: blodbank
    navn: "Blodbank med uavhengig temperaturovervåkning"
    ikon: material/bloodtype
    kategori: "Kjøl og frys"
    virksomhet: "Sykehus og blodbank"
    virksomhetIkon: lucide/hospital
    funksjon: "Kjøl (blod og medisin)"
    funksjonIkon: lucide/snowflake
    trussel:
      art: Tilsiktet
      kilde: "Ekstern aktør"
    eksponert: true
    angrepsvektor:
      - "Samme type kjølekontroller som i butikk kan stå eksponert. Shodan finner den på webgrensesnittet (HTTP/HTTPS) med et søk som **http.title:StoreView** eller **has_screenshot:true** på portene 80 og 443."
      - "Angriperen endrer settpunktet utenfra, akkurat som mot butikkfryseren. Forskjellen ligger ikke i angrepet, men i hva som fanger det opp."
    kort: "Samme angrep som mot butikken, men en uavhengig alarm varsler vakten i løpet av minutter"
    beskrivelse: "En blodbank kjøler blod og plasma innenfor strenge grenser. Kontrolleren kan være like eksponert som i en butikk, men blodlageret overvåkes døgnet rundt av en temperatursensor som er uavhengig av styringen. Da avgjør ikke angrepet utfallet, men deteksjonen: Avviket fanges på minutter, vakt rykker ut, og blodet reddes. Scenarioet speiler butikkfryseren og viser hva overvåkning utgjør. Det bygger på tre franske blodbanker som i november 2026 fanget temperaturendringen, der butikkene ikke gjorde det. I angrepet 02.11.26 forsøkte angriperne å varme blodkjøleskap mot 110 °C, men personalet grep inn."
    deteksjon:
      vedSteg: 3
      kilde: "Uavhengig temperaturovervåkning varslet døgnbemannet vakt straks avviket oppsto"
      forsinkelse: "4 minutter"
      overvaket: true
    lovkrav:
      - "Blodforskriften § 3-12"
      - "Digitalsikkerhetsloven § 8"
    steg:
      - tid: 0
        sys: blodkontroller
        status: eksponert
        melding: "Rekognosering: Kjølekontrolleren for blodlageret står åpen på internett for fjernservice, uten pålogging. Den er synlig i offentlige søketjenester, akkurat som butikkfryseren."
      - tid: 1500
        sys: blodkontroller
        status: manipulert
        melding: "Angrep: Angriperen endrer temperatur- og avrimingsstyringen utenfra, slik at lageret varmes over trygg grense. Kontrolleren utfører kommandoen uten pålogging, nøyaktig som i butikkangrepet."
      - tid: 3000
        sys: blodtemp
        status: advarsel
        melding: "Temperaturen i blodlageret begynner å stige. Her sitter en sensor som er uavhengig av styringen, og som måler direkte i lageret."
      - tid: 4500
        sys: blodalarm
        status: advarsel
        melding: "Den uavhengige overvåkningen fanger avviket straks og varsler døgnbemannet vakt. Alarmen går ikke gjennom den manipulerte kontrolleren, så den kan ikke dempes utenfra."
      - tid: 6000
        sys: blodkontroller
        status: normal
        melding: "Vakt kobler kontrolleren fra internett og setter settpunktet tilbake manuelt. Angriperen mister tilgangen."
      - tid: 7500
        sys: blodlager
        status: normal
        melding: "Temperaturen er tilbake innenfor trygg grense før blodet tok skade. Kjølekjeden holdt, og lageret er reddet. Forskjellen fra butikken var overvåkningen, ikke angrepet."
    tiltak:
